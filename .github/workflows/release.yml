name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.16.0-beta.1)'
        required: true
        type: string
      ref:
        description: 'Git ref to check out (branch, SHA, or tag). Defaults to tag. Use branch/SHA for dry-run before tag is pushed.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run — build and sign with test key, skip all publication'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

env:
  RELEASE_TAG:  ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref != '' && inputs.ref || inputs.tag) || github.ref_name }}

# ── Job 1: verify ─────────────────────────────────────────────────────────────
# No environment. Runs for both dry-run and live.
# Gates: version consistency, clean source tree, install, build.
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Show run mode
        run: |
          echo "Tag:          ${{ env.RELEASE_TAG }}"
          echo "CheckoutRef:  ${{ env.CHECKOUT_REF }}"
          echo "DryRun:       ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' || 'false' }}"

      - name: Verify clean source tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: dirty working tree"
            git status
            exit 1
          fi

      - name: Checkout SDK
        run: git clone --depth 1 --branch "${{ env.CHECKOUT_REF }}" https://github.com/rohinik-org/sdk sdk-checkout

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Verify tag matches beta-version.json
        run: node scripts/release-gates.mjs --check-version "${{ env.RELEASE_TAG }}"
        env:
          SDK_ROOT: ${{ github.workspace }}/sdk-checkout

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm -r --sort run build

# ── Job 2: publish-dry-run ────────────────────────────────────────────────────
# Only runs when dry_run == true. No environment (no tag restriction).
# Uses repo-level ROHINIK_SIGN_KEY_TEST to rehearse full signing path.
# No npm publish, no GitHub Release, no SDK dispatch.
  publish-dry-run:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Checkout SDK
        run: git clone --depth 1 --branch "${{ env.CHECKOUT_REF }}" https://github.com/rohinik-org/sdk sdk-checkout

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm -r --sort run build

      - name: '[DRY-RUN] Build runtime bundle (test signing key)'
        run: node scripts/build-bundle.mjs
        env:
          ROHINIK_SIGN_KEY: ${{ secrets.ROHINIK_SIGN_KEY_TEST }}
          ROHINIK_SIGN_KEY_PUB: ${{ github.workspace }}/security/dry-run-signing.pub
          SDK_ROOT: ${{ github.workspace }}/sdk-checkout

      - name: '[DRY-RUN] Verify provenance signature'
        run: node scripts/release-gates.mjs --check-provenance "${{ env.RELEASE_TAG }}"

      - name: '[DRY-RUN] Dry run complete'
        run: |
          VERSION=$(node -p "require('./core/runtime/install-manifest/package.json').version")
          echo ""
          echo "Dry run complete. All signing and gate steps passed."
          echo "  Bundle built and signed with ROHINIK_SIGN_KEY_TEST (keyId: 095ab65cfecddab6)"
          echo "  Provenance verified against test key in TRUSTED_KEYS"
          echo "  Would publish: @rohinik-org/install-manifest@$VERSION --tag beta"
          echo "  Would create GitHub Release ${{ env.RELEASE_TAG }}"
          echo "  Would dispatch coordinated-release to rohinik-org/sdk"
          echo ""
          echo "Next: verify existing tags, then push to trigger live release."

# ── Job 3: publish ────────────────────────────────────────────────────────────
# Only runs on live path (tag push or workflow_dispatch with dry_run=false).
# Uses npm-publish environment (restricted to refs/tags/v*).
# Full path: install-manifest publish → bundle build/sign → GitHub Release → SDK dispatch.
  publish:
    needs: verify
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write   # create GitHub Release, upload assets
      id-token: write   # npm OIDC trusted publish

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Checkout SDK at release tag
        run: git clone --depth 1 --branch "${{ env.RELEASE_TAG }}" https://github.com/rohinik-org/sdk sdk-checkout

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm -r --sort run build

      - name: Publish @rohinik-org/install-manifest
        working-directory: core/runtime/install-manifest
        run: npm publish --tag beta --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify install-manifest on npm
        run: |
          VERSION=$(node -p "require('./core/runtime/install-manifest/package.json').version")
          node scripts/release-gates.mjs --check-npm "@rohinik-org/install-manifest" "$VERSION" beta
        env:
          SDK_ROOT: ${{ github.workspace }}/sdk-checkout

      - name: Build runtime bundle
        run: node scripts/build-bundle.mjs
        env:
          ROHINIK_SIGN_KEY: ${{ secrets.ROHINIK_SIGN_KEY }}
          SDK_ROOT: ${{ github.workspace }}/sdk-checkout

      - name: Verify provenance signature
        run: node scripts/release-gates.mjs --check-provenance "${{ env.RELEASE_TAG }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Rohinik ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'alpha') }}
          files: |
            release/${{ env.RELEASE_TAG }}/rohinik-runtime-*.tar.gz
            release/${{ env.RELEASE_TAG }}/install-manifest-*.json
            release/${{ env.RELEASE_TAG }}/release-provenance-*.json
            release/${{ env.RELEASE_TAG }}/checksums.sha256

      - name: Verify GitHub Release assets
        run: node scripts/release-gates.mjs --check-github-release "${{ env.RELEASE_TAG }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch SDK coordinated release
        run: |
          VERSION=$(node -p "require('./core/runtime/install-manifest/package.json').version")
          gh api repos/rohinik-org/sdk/dispatches \
            --method POST \
            --field event_type=coordinated-release \
            --field "client_payload[tag]=${{ env.RELEASE_TAG }}" \
            --field "client_payload[version]=$VERSION" \
            --field "client_payload[rs1_run_id]=${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.SDK_DISPATCH_TOKEN }}
